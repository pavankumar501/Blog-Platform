<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogHub - Share Your Story</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .prose h1 { font-size: 2em; font-weight: 800; margin: 1em 0 0.5em; }
    .prose h2 { font-size: 1.5em; font-weight: 700; margin: 1em 0 0.5em; color: #4f46e5; }
    .prose p { margin: 0.8em 0; line-height: 1.8; color: #374151; }
    .prose ul, .prose ol { margin: 0.8em 0; padding-left: 1.5em; }
    .prose li { margin: 0.3em 0; line-height: 1.7; }
    .prose blockquote { border-left: 4px solid #6366f1; padding-left: 1em; margin: 1em 0; color: #6b7280; font-style: italic; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
